name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests with network disabled and generate report
        run: python run_tests.py --report ci-reports/test-results.md
      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: ci-reports/test-results.md
          if-no-files-found: warn
